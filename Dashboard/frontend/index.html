<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WeathX - Real-Time Weather Analytics Dashboard with AWS Kinesis + Lambda Simulation">
    <title>WeathX - Weather Analytics Dashboard</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <!-- App Container -->
    <div id="app">
        <!-- Navigation will be inserted here -->
        <div id="navbar-container"></div>
        
        <!-- Connection Status -->
        <div id="connection-status"></div>
        
        <!-- Main Content Area -->
        <main id="main-content"></main>
        
        <!-- Footer -->
        <footer class="footer">
            <span>WeathX - Weather Analytics Dashboard</span>
            <span>Powered by AWS Kinesis + Lambda | OpenWeatherMap</span>
        </footer>
    </div>
    
    <!-- JavaScript Modules -->
    <script src="js/theme.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/components/metricCard.js"></script>
    <script src="js/components/weatherHeroCard.js"></script>
    <script src="js/components/temperatureChart.js"></script>
    <script src="js/components/sunriseSunsetCard.js"></script>
    <script src="js/components/airQualityCard.js"></script>
    <script src="js/components/chanceOfRainChart.js"></script>
    <script src="js/components/forecastBar.js"></script>
    <script src="js/components/pipelineStatus.js"></script>
    <script src="js/components/liveStream.js"></script>
    <script src="js/pages/home.js"></script>
    <script src="js/pages/pipeline.js"></script>
    <script src="js/pages/analytics.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
